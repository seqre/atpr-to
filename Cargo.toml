[package]
name = "atpr-to"
version = "0.1.0"
edition = "2021"
# Without this `cargo run` refuses to pick, because `codegen` is declared as a
# binary even though its `required-features` keep it out of a normal build. So
# `just run` — the documented way to serve this locally — failed with "could
# not determine which binary to run".
default-run = "atpr-to"

[features]
# Enables the `codegen` binary that regenerates `src/generated/` from `lexicons/`.
# Off by default so normal builds don't compile the lexicon code generator.
codegen = ["jacquard-lexicon/codegen"]

[[bin]]
name = "codegen"
path = "src/bin/codegen.rs"
required-features = ["codegen"]

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
# `loopback` (jacquard's CLI browser-open flow) pulls in rouille — a full
# synchronous HTTP server — which is dead weight in a Lambda function. The
# Bluesky AppView and community lexicon surfaces (`api_full`) are unused too:
# this app calls four `com.atproto.repo.*` endpoints plus identity resolution.
# `tracing` is not a default feature and must be opted into explicitly.
jacquard = { version = "0.12.1", default-features = false, features = [
    "api",
    "cache",
    "derive",
    "dns",
    "tracing",
] }
jacquard-common = "0.12.1"
jacquard-derive = "0.12.1"
jacquard-lexicon = "0.12.1"
lambda_http = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 0.9 rather than 0.10 so this shares a copy with jacquard-common.
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `parsing`/`formatting`/`macros` are for the preview page's date, which arrives
# as an ISO-8601 string from a record and is shown to a stranger. Cookie expiry
# (axum-extra) needs none of them, which is why they were not on before.
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
thiserror = "2"
tower = "0.5"
# `set-header` for the security headers and cache policy, `trace` so requests are
# actually logged, `timeout` as the backstop below Lambda's 30s.
tower-http = { version = "0.6", features = ["set-header", "timeout", "trace"] }
url = { version = "2", features = ["serde"] }
urlencoding = "2"
tracing = "0.1"
anyhow = "1"
config = "0.15"
askama = "0.15"
qrcode = "0.14"
tower_governor = "0.8.0"
rust-embed = "8"
# The shared session store.
#
# Neither of these enables a TLS feature, and that is deliberate. The SDK's own
# `rustls` feature resolves to rustls-aws-lc, which builds `aws-lc-sys` from C
# -- a cross-compilation hazard for the arm64 Lambda target and a second crypto
# backend in a binary that already links ring through reqwest. The HTTPS client
# is built explicitly in `session/dynamo.rs` from `aws-smithy-http-client` with
# the ring provider instead, so there is exactly one.
aws-config = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = [
    "rt-tokio",
] }
aws-smithy-http-client = { version = "1", default-features = false, features = [
    "rustls-ring",
] }
mime_guess = "2"

[dev-dependencies]
# `test-util` brings the SDK's own replay client, so the DynamoDB store can be
# exercised against canned wire responses instead of AWS.
aws-smithy-http-client = { version = "1", features = ["test-util"] }
aws-smithy-types = "1"
http = { package = "http", version = "1" }
# Used to exercise config deserialization directly, without touching the
# process environment or the working directory.
toml = "0.9"
wiremock = "0.6.5"

[lints.rust]
missing_docs = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
# Deliberately NOT `panic = "abort"`. `lambda_runtime` wraps each invocation in
# `catch_unwind` so a panicking handler becomes a reported error; aborting would
# instead kill the execution environment and force a cold start on the next
# caller. On a cold-start-bound function that trade is the wrong way round.
