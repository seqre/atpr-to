AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: atpr.to — AT Protocol URL Shortener

Parameters:
  DomainName:
    Type: String
    Default: ""
    Description: >-
      Custom domain to map the API to. Leave empty to deploy without one — the
      stack then serves from the execute-api URL in the outputs. Previously the
      mapping was unconditional and pointed at a DomainName resource this
      template never created, so a from-scratch deploy could not succeed.
  CertificateArn:
    Type: String
    Default: ""
    Description: >-
      ACM certificate for DomainName, in this stack's region. Required when
      DomainName is set. HTTP APIs need a regional certificate, not us-east-1.
  LogRetentionDays:
    Type: Number
    Default: 30
    Description: CloudWatch retention. The default is "never expire", which bills forever.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]

Globals:
  Function:
    Timeout: 30
    # 128MB was the default, not a measurement. vCPU is allocated in proportion
    # to memory, so a cold start that is dominated by runtime init gets faster
    # roughly in step with the size increase — which usually makes the larger
    # setting *cheaper*, since duration falls faster than the per-ms rate rises.
    # Worth re-measuring against real invocations before tuning further.
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        RUST_LOG: info

Resources:
  AtprToApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # The real rate limit. The in-process governor is per execution
      # environment by construction, so under any concurrency it bounds nothing
      # global; this does.
      DefaultRouteSettings:
        ThrottlingRateLimit: 50
        ThrottlingBurstLimit: 100
        DetailedMetricsEnabled: true

  AtprToFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: atpr-to
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Environment:
        Variables:
          ATPR__BASE_URL: "https://atpr.to"
          ATPR__SLINGSHOT_URL: "https://slingshot.microcosm.blue/"
          # Shared across every execution environment, which is the whole point.
          # This used to be /tmp/sessions.json -- per-instance, so an
          # authorization request written while a login started was missing when
          # the callback landed elsewhere, and logins failed nondeterministically
          # under any concurrency at all.
          ATPR__SESSION_FILE: !Sub "dynamodb://${AtprToSessions}"
      Policies:
        # The four calls session/dynamo.rs makes, on the one table it makes them
        # against. Not a managed policy: `AmazonDynamoDBFullAccess` would grant
        # this function the right to drop every table in the account.
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt AtprToSessions.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AtprToApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref AtprToApi
            Path: /
            Method: ANY

  # OAuth sessions and in-flight authorization requests, keyed by `pk`.
  #
  # On-demand billing because the load is one small read and one small write per
  # sign-in: provisioned capacity would mean paying for idle throughput on a
  # table that is empty most of the day.
  #
  # `expires_at` is the TTL attribute. It is what reaps abandoned logins --
  # every item is written with a deadline, so nothing here has to be swept by
  # hand. AWS deletes within a few days of expiry rather than at it, which is
  # why the store also filters expired items on read.
  AtprToSessions:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        # It holds DPoP private keys and refresh tokens. The file store creates
        # its file 0600 for the same reason.
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        # Sessions are disposable: the worst case for losing this table is that
        # everyone signs in again. Not worth the continuous-backup charge.
        PointInTimeRecoveryEnabled: false

  # Declared explicitly only to set retention. CloudFormation will not adopt a
  # log group that already exists, so a stack that has run without this needs
  # the existing /aws/lambda/atpr-to group deleted before the first deploy that
  # includes it.
  AtprToLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/atpr-to
      RetentionInDays: !Ref LogRetentionDays

  AtprToDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  AtprToDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomain
    Properties:
      DomainName: !Ref AtprToDomain
      ApiId: !Ref AtprToApi
      Stage: $default

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${AtprToApi}.execute-api.${AWS::Region}.amazonaws.com/"
  DomainTarget:
    Description: Point the custom domain's DNS at this (CNAME or Route 53 alias).
    Condition: HasDomain
    Value: !GetAtt AtprToDomain.RegionalDomainName
