[package]
name = "atpr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared read path for atpr.to: config, domain types, resolver, and the standalone redirect router"

[lints]
workspace = true

[dependencies]
anyhow = "1"
# `macros` for `middleware::from_fn` and route macros.
axum = { version = "0.8.9", features = ["macros"] }
askama = "0.15"
config = "0.15"
# Only the identity-resolution surface: handle → DID → DID document. The
# OAuth/AppView features stay in the server crate.
jacquard = { version = "0.12.1", default-features = false, features = [
    "api",
    "cache",
    "dns",
    "tracing",
] }
# Named so `client_ip_rate_limit` can spell out its `GovernorConfig`'s
# middleware parameter; tower_governor uses this exact version.
governor = "0.10"
jacquard-common = "0.12.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tower = "0.5"
# `set-header` for the security headers, `timeout` as the request-budget backstop,
# `trace` so requests are actually logged.
tower-http = { version = "0.6", features = ["set-header", "timeout", "trace"] }
tower_governor = "0.8.0"
tracing = "0.1"
url = { version = "2", features = ["serde"] }
urlencoding = "2"

[dev-dependencies]
# Exercises config deserialization directly, without touching the process
# environment or the working directory.
toml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
